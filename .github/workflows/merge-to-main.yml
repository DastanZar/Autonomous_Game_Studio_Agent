# Safety net: any agent that pushes work to a side branch gets it merged into main automatically,
# so nothing is stranded on a branch nobody looks at. Conflicts fail this run (visible under Actions).
name: merge-to-main
on:
  push:
    branches-ignore: [main, gh-pages]
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: |
          git config user.name "studio-merge-bot"
          git config user.email "studio-merge-bot@users.noreply.github.com"
          git merge --no-ff --no-edit "origin/${GITHUB_REF_NAME}" -m "Auto-merge ${GITHUB_REF_NAME} into main"
          git push origin main
