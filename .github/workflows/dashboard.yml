# Publishes the studio dashboard to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - run: python3 studio/studio.py dashboard
      - run: mkdir -p _site && cp docs/dashboard.html _site/index.html && cp docs/site/*.html _site/
      - run: for f in $(find episodes shorts videos -path '*/out/*' -type f); do if [ -f "$f" ]; then mkdir -p "_site/media/$(dirname "$f")"; cp "$f" "_site/media/$f"; fi; done; while read -r f; do if [ -f "$f" ]; then mkdir -p "_site/media/$(dirname "$f")"; cp "$f" "_site/media/$f"; fi; done < docs/site-media.txt; du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
