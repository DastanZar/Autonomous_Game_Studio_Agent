# Publishes the studio dashboard to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - run: python3 studio/studio.py dashboard
      - run: mkdir -p _site && cp docs/dashboard.html _site/index.html && cp docs/site/*.html _site/
      # Full-quality media, exactly as rendered (no re-encoding). Pages caps a site at 1 GB: the only thing left out is
      # the three full-size Point Roberts method variants, whose review previews are published instead.
      - name: media
        run: |
          add() { f="$1"; [ -f "$f" ] || return 0; mkdir -p "_site/media/$(dirname "$f")"; cp "$f" "_site/media/$f"; }
          for f in $(find episodes shorts videos -path '*/out/*' -type f | grep -v '/variants/.*/out/point-roberts.mp4$'); do add "$f"; done
          while read -r f; do add "$f"; done < docs/site-media.txt
          du -sh _site
      # full-quality masters of every episode with a package.json, as downloads on the "masters" release
      - name: masters release
        continue-on-error: true    # a download-page hiccup (e.g. an upload cut off by a cancelled run) must never block the dashboard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view masters >/dev/null 2>&1 || gh release create masters --title "Video masters (full quality, for upload)" --notes "Full-quality MP4, captions and thumbnail of every packaged episode, refreshed on every push to main. The dashboard plays the same files; download them here for YouTube Studio."
          files=""; for p in $(find episodes -name package.json); do d=$(dirname "$p"); s=$(basename "$d")
            [ -f "$d/out/$s.mp4" ] && files="$files $d/out/$s.mp4"; [ -f "$d/out/$s.srt" ] && files="$files $d/out/$s.srt"
            [ -f "$d/out/thumbnail.jpg" ] && cp "$d/out/thumbnail.jpg" "/tmp/$s-thumbnail.jpg" && files="$files /tmp/$s-thumbnail.jpg"; done
          have=$(gh release view masters --json assets --jq '.assets[] | "\(.name) \(.size)"')
          up=""; for f in $files; do n=$(basename "$f"); sz=$(stat -c %s "$f"); echo "$have" | grep -qx "$n $sz" || up="$up $f"; done
          if [ -n "$up" ]; then for f in $up; do gh release delete-asset masters "$(basename "$f")" -y 2>/dev/null || true; done; gh release upload masters $up --clobber; else echo "masters unchanged"; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
