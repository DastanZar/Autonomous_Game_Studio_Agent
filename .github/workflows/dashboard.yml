# Publishes the studio dashboard to GitHub Pages on every push to main.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install jsonschema
      - run: python3 studio/studio.py dashboard
      - run: mkdir -p _site && cp docs/dashboard.html _site/index.html && cp docs/site/*.html _site/
      # Pages caps a site at 1 GB, so the dashboard gets light 540p previews (same paths); full-quality masters go to
      # the "masters" release below. Images, captions and other files are copied as they are.
      - name: media (previews)
        run: |
          sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1 || true
          add() { f="$1"; [ -f "$f" ] || return 0; mkdir -p "_site/media/$(dirname "$f")"
            case "$f" in *.mp4) ffmpeg -loglevel error -y -i "$f" -vf "scale=-2:960" -c:v libx264 -preset veryfast -crf 30 -c:a aac -b:a 96k -movflags +faststart "_site/media/$f" || cp "$f" "_site/media/$f";;
              *) cp "$f" "_site/media/$f";; esac; }
          for f in $(find episodes shorts videos -path '*/out/*' -type f); do add "$f"; done
          while read -r f; do add "$f"; done < docs/site-media.txt
          du -sh _site
      # full-quality masters of every episode with a package.json, as downloads on the "masters" release
      - name: masters release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view masters >/dev/null 2>&1 || gh release create masters --title "Video masters (full quality, for upload)" --notes "Full-quality MP4, captions and thumbnail of every packaged episode, refreshed on every push to main. Preview them on the dashboard; download them here for YouTube Studio."
          files=""; for p in $(find episodes -name package.json); do d=$(dirname "$p"); s=$(basename "$d")
            [ -f "$d/out/$s.mp4" ] && files="$files $d/out/$s.mp4"; [ -f "$d/out/$s.srt" ] && files="$files $d/out/$s.srt"
            [ -f "$d/out/thumbnail.jpg" ] && cp "$d/out/thumbnail.jpg" "/tmp/$s-thumbnail.jpg" && files="$files /tmp/$s-thumbnail.jpg"; done
          have=$(gh release view masters --json assets --jq '.assets[] | "\(.name) \(.size)"')
          up=""; for f in $files; do n=$(basename "$f"); sz=$(stat -c %s "$f"); echo "$have" | grep -qx "$n $sz" || up="$up $f"; done
          [ -z "$up" ] && echo "masters unchanged" || gh release upload masters $up --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
