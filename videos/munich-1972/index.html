<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0f1114; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; }
      /* film-long background: paper in act 1, draining to night, then ink */
      #bg { position: absolute; inset: 0; background: #f4f1ea; }
      /* static grain + vignette over everything (no animation) */
      #grain {
        position: absolute; inset: 0; pointer-events: none; z-index: 50; opacity: 0.10; mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' seed='72'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
      }
      #vignette { position: absolute; inset: 0; pointer-events: none; z-index: 49;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.28) 100%); }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>

    <script>
      const tl = gsap.timeline({ paused: true });
      // background arc: night (cold open) -> paper (the Cheerful Games) -> night (from "Then,") -> ink (from S6)
      tl.set("#bg", { backgroundColor: "#0f1114" }, 0);
      tl.to("#bg", { backgroundColor: "#f4f1ea", duration: 0.25, ease: "none" }, 27.4);
      tl.to("#bg", { backgroundColor: "#0f1114", duration: 1.6, ease: "power2.inOut" }, 54.2);
      tl.to("#bg", { backgroundColor: "#16181c", duration: 2.0, ease: "power1.inOut" }, 170.9);
      window.__timelines["main"] = tl;
