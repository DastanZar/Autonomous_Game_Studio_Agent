  <script>
    (function () {
      const DUR = 20.0;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);
      const hash = (n) => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };

      // ---- build the nine bars (one per hostage) ----
      const nine = $("s6-nine");
      for (let i = 0; i < 9; i++) {
        const b = document.createElement("div");
        b.className = "s6-bar";
        b.style.left = (i * 58) + "px";
        nine.appendChild(b);
      }
      const bars = nine.querySelectorAll(".s6-bar");

      // ---- torn bottom edge for the wire card (seeded) ----
      const pts = ["0% 0%", "100% 0%", "100% 94%"];
      for (let i = 1; i < 40; i++) {
        const x = 100 - i * 2.5;
        const y = 93 + hash(i + 7) * 6;
        pts.push(x.toFixed(2) + "% " + y.toFixed(2) + "%");
      }
      pts.push("0% 96%");
      $("s6-card-paper").style.clipPath = "polygon(" + pts.join(",") + ")";
      $("s6-card-shadow").style.clipPath = "polygon(" + pts.join(",") + ")";

      const pad = (n) => (n < 10 ? "0" : "") + n;
      const clockStr = (mins) => { const m = Math.round(mins); const h = Math.floor(m / 60) % 24; return pad(h) + ":" + pad(m % 60); };

      // ---- initial states ----

      // ---- master driver: flicker, clock, slug, typewriter, caret ----
      const START_MIN = 22 * 60 + 38, END_MIN = 24 * 60;      // 22:38 -> 00:00
      const clockState = { m: START_MIN };
      const rclock = { m: 0 };
      const textEl = $("s6-text"), typeEl = $("s6-type"), caretEl = $("s6-caret");
      const slugEl = $("s6-slug"), clockEl = $("s6-clock"), rclockEl = $("s6-rclock"), flick = $("s6-flicker");

      // typewriter states (discrete-text-sequence): type on spoken words, backspace, retype in DM Serif
      const SEQ = [{ t: 0, text: "", f: "m" }];
      const typeWord = (word, t0, step, prefix, f) => {
        for (let i = 1; i <= word.length; i++) SEQ.push({ t: t0 + (i - 1) * step, text: prefix + word.slice(0, i), f });
        return prefix + word;
      };
      let s = typeWord("HOSTAGES", 12.26, 0.045, "", "m");       // "hostages" @12.28
      s = typeWord(" SAFE", 13.08, 0.05, s, "m");                 // "saved." @13.10
      // backspace while McKay "told America" (17.80)
      for (let i = s.length - 1; i >= 0; i--) SEQ.push({ t: 17.84 + (s.length - 1 - i) * 0.05, text: s.slice(0, i), f: "m" });
      let r = typeWord("“They’re", 18.62, 0.028, "", "s");  // they're @18.66
      r = typeWord(" all", 18.86, 0.03, r, "s");                    // all @18.86
      r = typeWord(" gone.”", 18.98, 0.032, r, "s");            // gone. @18.98
      SEQ.sort((a, b) => a.t - b.t);
      const stateAt = (t) => { for (let i = SEQ.length - 1; i >= 0; i--) if (t >= SEQ[i].t) return SEQ[i]; return SEQ[0]; };

      let lastText = null, lastFont = null, lastSlug = null, lastClock = null, lastR = null;

      // ===== Phase 1 (0 – 5.6): the hour at Fürstenfeldbruck =====
      tl.fromTo("#s6-slug", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.6);
      tl.fromTo("#s6-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 0.6);
      tl.fromTo("#s6-place", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.6);
      tl.fromTo("#s6-clock", { opacity: 0, y: 40, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0.6);
      tl.fromTo("#s6-track", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.94);
      tl.fromTo("#s6-trackl", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power3.out" }, 0.94);
      tl.fromTo("#s6-fill", { scaleX: 0 }, { scaleX: 1, duration: 2.48, ease: "power2.inOut" }, 0.94);
      tl.to(clockState, { m: END_MIN, duration: 2.48, ease: "power2.inOut" }, 0.94);   // lands on "midnight" @3.42
      tl.fromTo("#s6-trackr", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 3.42);
      tl.fromTo("#s6-clock", { color: "#ECE8DF" }, { color: "#5BB3E6", duration: 0.3, ease: "power2.out", immediateRender: false }, 3.42);
      // nine hostages, one mark each, on "nine hostages"
      tl.fromTo(bars, { scaleY: 0 }, { scaleY: 1, duration: 0.6, ease: "power3.out", stagger: 0.05 }, 4.54);
      tl.fromTo("#s6-ninel", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.84);
      // "dead." — the marks go dark, the clock group recedes, the photo rises
      tl.to(bars, { opacity: 0.16, duration: 0.9, ease: "power2.out", stagger: 0.04 }, 5.64);
      tl.to("#s6-p1", { opacity: 0, y: -30, duration: 1.1, ease: "power2.inOut" }, 6.1);

      // ===== Phase 2 (5.6 – 11.4): the burned helicopter (2.5D push, first half only) =====
      tl.fromTo("#s6-photo", { opacity: 0 }, { opacity: 1, duration: 1.8, ease: "power2.inOut" }, 5.64);
      tl.fromTo("#s6-plane-bg", { scale: 1.10, x: 30, y: 0 }, { scale: 1.04, x: -10, y: -6, duration: 5.6, ease: "power2.out" }, 5.64);
      tl.fromTo("#s6-plane-fg", { scale: 1.14, x: 70, y: 6 }, { scale: 1.07, x: -40, y: -10, duration: 5.6, ease: "power2.out" }, 5.64);
      // name card: rule draws on "police", name wipes on "Anton"
      tl.fromTo("#s6-namerule", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.out" }, 7.30);
      tl.fromTo("#s6-name", { clipPath: "inset(0 100% 0 0)", x: -16 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.9, ease: "power3.out" }, 8.80);
      tl.fromTo("#s6-role", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 9.30);

      // ===== Phase 3 (11.4 – 20): the wire, the retraction =====
      tl.to("#s6-photo", { opacity: 0.22, filter: "blur(6px)", duration: 0.9, ease: "power2.inOut" }, 11.2);
      tl.to(["#s6-namerule", "#s6-name", "#s6-role"], { opacity: 0, x: -60, duration: 0.5, ease: "power2.in" }, 11.2);
      tl.fromTo("#s6-card", { opacity: 0, x: 260, rotation: 1.5, scale: 1 }, { opacity: 1, x: 0, rotation: -1.2, duration: 0.9, ease: "expo.out" }, 11.38);
      tl.fromTo("#s6-card-line", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 11.6);
      tl.fromTo("#s6-card-foot", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power3.out" }, 11.9);
      tl.to("#s6-card", { scale: 1.035, duration: 6.4, ease: "power1.inOut" }, 12.3);
      // "after three in the morning" — the clock jumps to 03:24
      tl.fromTo("#s6-rdate", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 14.82);
      tl.fromTo("#s6-rclock", { opacity: 0, scale: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 1.0, ease: "power3.out" }, 15.14);
      tl.to(rclock, { m: 3 * 60 + 24, duration: 1.0, ease: "power3.out" }, 15.14);
      tl.fromTo("#s6-rrule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 16.46);
      tl.fromTo("#s6-rname", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 17.02);
      tl.fromTo("#s6-rnote", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 17.44);
      // focus collapses onto the headline as it is retyped; then everything holds still
      tl.to("#s6-r", { opacity: 0.28, duration: 0.8, ease: "power2.inOut" }, 18.4);
      tl.to("#s6-card-kicker", { opacity: 0.25, duration: 0.6, ease: "power2.inOut" }, 17.84);
      tl.to("#s6-photo", { opacity: 0.1, duration: 0.8, ease: "power2.inOut" }, 18.4);

      // master driver added LAST so it reads tween-driven proxies after they update on a seek
      const drv = { t: 0 };
      tl.to(drv, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: () => {
          const t = drv.t;
          // faint seeded light flicker (distant floodlights), only in the first beat
          const fr = Math.floor(t * 30);
          let fo = 0;
          if (t > 0.5 && t < 6.6) {
            const env = Math.min(1, (t - 0.5) / 0.6) * (t > 5.6 ? Math.max(0, 1 - (t - 5.6) / 1.0) : 1);
            fo = env * (0.10 + 0.16 * hash(Math.floor(fr / 3)) * (hash(fr + 900) > 0.35 ? 1 : 0.35));
          }
          flick.style.opacity = fo.toFixed(3);

          // big clock + slug
          const cs = clockStr(clockState.m);
          if (cs !== lastClock) { clockEl.textContent = cs; lastClock = cs; }
          const slug = t < 15.14 ? "05·09·1972  " + cs : "06·09·1972  03:24";
          const slugTxt = (t >= 3.42 && t < 15.14) ? "06·09·1972  00:00" : slug;
          if (slugTxt !== lastSlug) { slugEl.textContent = slugTxt; lastSlug = slugTxt; }
          const rs = clockStr(rclock.m);
          if (rs !== lastR) { rclockEl.textContent = rs; lastR = rs; }

          // typewriter
          const st = stateAt(t);
          if (st.f !== lastFont) { typeEl.className = st.f === "s" ? "s6-serif" : "s6-mono"; lastFont = st.f; }
          if (st.text !== lastText) { textEl.textContent = st.text; lastText = st.text; }
          // caret: blink while waiting, solid while typing, gone after the line lands (hold still)
          let co = 0;
          if (t >= 11.5 && t < 19.4) {
            const typing = SEQ.some((e) => e.t <= t && t - e.t < 0.12 && e.t > 11);
            co = typing ? 1 : (Math.sin(t * Math.PI * 2 / 0.9) > 0 ? 1 : 0);
          }
          caretEl.style.opacity = co;
          caretEl.style.height = st.f === "s" ? "96px" : "100px";
        }
      }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["s6"] = tl;
    })();
