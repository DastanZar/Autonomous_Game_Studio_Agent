  <script src="assets/vendor/gsap.min.js"></script>
  <script>
    (function () {
      const DUR = 11.5;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);

      // decade ticks (1982 … 2012) on the 1972→2022 axis: 48 px per year
      const tw = $("s8-ticks");
      [1982, 1992, 2002, 2012].forEach((y) => {
        const x = 240 + (y - 1972) * 48;
        const t = document.createElement("div"); t.className = "s8-tick"; t.style.left = x + "px"; tw.appendChild(t);
        const l = document.createElement("div"); l.className = "s8-tlabel"; l.style.left = x + "px"; l.textContent = y; tw.appendChild(l);
      });

      // ---- camera (world pan) ----
      const cam = { x: 0, y: 0 };
      const world = $("s8-world"), hud = $("s8-hud"), photo = $("s8-photo");
      // ---- the 50-year fill: one proxy drives bar, head readout and counter (same ease = one beat) ----
      const fp = { p: 0 };
      const fill = $("s8-fill"), head = $("s8-head"), cnt = $("s8-cnt");
      const money = { v: 0 };
      const cnum = $("s8-c-num");
      let lastHead = null, lastCnt = null, lastMoney = null;

      // ===== Station 1 (0 – 0.82): 1972 =====
      tl.fromTo("#s8-slug", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.1);
      tl.fromTo("#s8-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 0.1);
      tl.fromTo("#s8-track", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power3.out" }, 0.0);
      tl.fromTo(["#s8-y72", "#s8-y72s"], { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out", stagger: 0.12 }, 0.2);
      tl.fromTo("#s8-ticks", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.6);
      tl.fromTo("#s8-photo", { x: 0 }, { x: -160, duration: 5.6, ease: "power2.out" }, 0);
      tl.fromTo("#s8-pl-fg", { x: 0 }, { x: -120, duration: 5.6, ease: "power2.out" }, 0);

      // ===== Pan (0.82 – 2.60): the bar fills fifty years while the camera tracks the head =====
      tl.fromTo("#s8-cnt", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.78, ease: "power2.inOut" }, 0.82);
      tl.fromTo("#s8-cnt-unit", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.32);
      // "apologize." — the stamp lands at the end of the bar
      tl.fromTo("#s8-pin", { scale: 0 }, { scale: 1, duration: 0.45, ease: "power3.out" }, 2.5);
      tl.fromTo("#s8-pinring", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.55);
      tl.fromTo("#s8-apology", { opacity: 0, scale: 1.25, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 2.60);
      // "2022,"
      tl.fromTo("#s8-y22", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 3.92);
      // "its president" / "a triple failure."
      tl.fromTo("#s8-pres", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 5.50);
      tl.fromTo("#s8-q0", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 6.74);
      tl.fromTo("#s8-q1", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 7.12);
      tl.fromTo("#s8-qline", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 7.45);

      // ===== Pan down (8.18 – 9.2): the line drops to the families; €28,000,000 =====
      tl.fromTo("#s8-drop", { scaleY: 0 }, { scaleY: 1, duration: 1.0, ease: "power2.inOut" }, 8.18);
      tl.to("#s8-cnt-wrap", { opacity: 0, duration: 0.4, ease: "power2.in" }, 8.18);
      tl.fromTo("#s8-c-kick", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 8.6);
      tl.fromTo("#s8-c-dot", { scale: 0 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 9.1);
      tl.fromTo("#s8-c-num", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" }, 9.22);
      tl.fromTo("#s8-c-fill", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 9.22);
      tl.fromTo("#s8-c-sub", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 10.22);

      // ===== single writer for camera + proxy-driven text, added LAST so it reads post-seek values =====
      const drv = { t: 0 };
      const E_IO2 = gsap.parseEase("power2.inOut"), E_IO1 = gsap.parseEase("power1.inOut"), E_IO3 = gsap.parseEase("power3.inOut"), E_O3 = gsap.parseEase("power3.out");
      const seg = (t, t0, d, e) => e(Math.max(0, Math.min(1, (t - t0) / d)));
      tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: () => {
        const t = drv.t;
        // camera + proxies computed from t (order-independent under seeking)
        fp.p = seg(t, 0.82, 1.78, E_IO2);                                   // 50-year fill, lands on "apologize."
        cam.x = -1080 * seg(t, 0.82, 1.78, E_IO2) - 40 * seg(t, 3.0, 4.2, E_IO1) - 80 * seg(t, 8.18, 1.0, E_IO3);
        cam.y = -1080 * seg(t, 8.18, 1.0, E_IO3);                           // drop to the families
        money.v = 28000000 * seg(t, 9.22, 1.2, E_O3);                        // "28 million euros."
        world.style.transform = "translate(" + cam.x.toFixed(2) + "px," + cam.y.toFixed(2) + "px)";
        hud.style.transform = "translate(0px," + (cam.y * 1.0).toFixed(2) + "px)";
        photo.style.top = (-120 + cam.y * 0.12).toFixed(2) + "px";
        fill.style.transform = "scaleX(" + fp.p.toFixed(4) + ")";
        head.style.left = (240 + 2400 * fp.p).toFixed(1) + "px";
        head.style.opacity = Math.max(0, Math.min(1, (fp.p - 0.07) / 0.06, (2.9 - drv.t) / 0.3)).toFixed(3);
        const y = String(1972 + Math.round(50 * fp.p));
        if (y !== lastHead) { head.textContent = y; lastHead = y; }
        const c = String(Math.round(50 * fp.p));
        if (c !== lastCnt) { cnt.textContent = c; lastCnt = c; }
        const m = "€" + (Math.round(money.v / 1000) * 1000).toLocaleString("en-US");
        if (m !== lastMoney) { cnum.textContent = m; lastMoney = m; }
      } }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["s8"] = tl;
    })();
  </script>
