      tl.fromTo(rp, { a: 0 }, { a: 1, duration: 2.6, ease: "power1.inOut", onUpdate: routeWrite, immediateRender: false }, 7.46);
      tl.fromTo(rp, { b: 0 }, { b: 1, duration: 0.8, ease: "power2.out", onUpdate: routeWrite, immediateRender: false }, 10.76);
      tl.to(["#s3-who1", "#s3-who2"], { opacity: 0.35, duration: 0.5 }, 7.6);
      // apartment 2: "past one apartment"
      svgType($("#s3-a2a"), 8.46, 30);
      svgType($("#s3-a2b"), 9.1, 30);
      tl.to(["#s3-box2", "#s3-n2"], { opacity: 0.45, duration: 0.6, ease: "power2.out" }, 10.04);
      tl.to(["#s3-a2a", "#s3-a2b"], { opacity: 0.55, duration: 0.6, ease: "power2.out" }, 10.04);
      // camera push toward apartment 3 (coordinate target: outer scale, inner counter-translate)
      tl.to("#s3-plan-cam", { scale: 1.22, duration: 2.4, ease: "power3.inOut" }, 10.04);
      tl.to("#s3-plan-pan", { x: -330, y: 70, duration: 2.4, ease: "power3.inOut" }, 10.04);
      // apartment 3 labels: "Wrestlers," / "weightlifters,"
      svgType($("#s3-a3a"), 12.64, 30);
      svgType($("#s3-a3b"), 13.6, 30);
      // "maybe hoping" — box 3 glows Munich blue
      tl.to("#s3-box3", { stroke: "#5BB3E6", duration: 0.5, ease: "power2.out" }, 14.86);
      tl.fromTo("#s3-glow", { opacity: 0 }, { opacity: 0.85, duration: 0.7, ease: "power2.out" }, 14.86);
      tl.fromTo("#s3-a3c", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 15.18);
      tl.to("#s3-plan-cam", { scale: 1.28, duration: 2.2, ease: "power2.out" }, 15.2);
      tl.set("#s3-plan", { autoAlpha: 0 }, 17.6);

      /* ---------- C · the apartment afterwards (17.6 – 30.6) ---------- */
      flash(17.6, 0.5);
      tl.fromTo("#s3-apt", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, 17.6);
      tl.fromTo("#s3-apt-card", { transformPerspective: 1700, rotationY: -15, rotationX: 3, z: -160, x: 90 },
        { rotationY: -5, rotationX: 0, z: 0, x: 0, duration: 6.2, ease: "power2.out" }, 17.6);
      tl.fromTo("#s3-apt-back", { x: -60, scale: 1.14 }, { x: 20, scale: 1.08, duration: 6.4, ease: "power1.out" }, 17.6);
      // Weinberg returns: "Weinberg fought again" ... "killed."
      nameIn($("#s3-name1"), 18.94);
      tl.fromTo("#s3-name1 .s3-role", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 19.2);
      tl.fromTo("#s3-k1", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 20.94);
      tl.to("#s3-name1", { opacity: 0.55, duration: 0.6, ease: "power2.out" }, 22.22);
      // Romano: "Weightlifter Yossef Romano" ... "shot too."
      nameIn($("#s3-name2"), 23.34);
      tl.fromTo("#s3-name2 .s3-role", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 23.6);
      tl.fromTo("#s3-k2", { opacity: 0, scale: 1.5 }, { opacity: 1, scale: 1, duration: 0.35, ease: "expo.out" }, 26.28);
      // "They left his body at his teammates' feet." — restraint: slow push + light closes in
      tl.fromTo("#s3-apt-dim", { opacity: 0 }, { opacity: 1, duration: 2.4, ease: "power2.inOut" }, 27.68);
      tl.to("#s3-apt-card", { z: 70, duration: 2.8, ease: "power2.inOut" }, 27.68);
      // zoom-through out
      tl.to("#s3-apt .s3-weave", { scale: 1.25, filter: "blur(10px)", opacity: 0, duration: 0.32, ease: "power2.in" }, 30.34);
      tl.to(["#s3-name1", "#s3-name2"], { opacity: 0, duration: 0.24, ease: "power2.in" }, 30.38);
      tl.set("#s3-apt", { autoAlpha: 0 }, 30.66);

      /* ---------- D · nine men tied (30.6 – 34.3) ---------- */
      const svg = $("#s3-nine-svg");
      const X0 = 260, DX = 175, HEAD_Y = 392;
      const mk = (tag, attrs, cls) => { const e = document.createElementNS(SVGNS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (cls) e.setAttribute("class", cls); svg.appendChild(e); return e; };
      let chainD = "";
      const figs = [], ties = [];
      for (let i = 0; i < 9; i++) {
        const x = X0 + i * DX;
        const head = mk("circle", { cx: x, cy: HEAD_Y, r: 30 }, "s3-fig");
        const torso = mk("path", { d: `M${x - 46},560 L${x - 46},478 Q${x - 46},446 ${x - 16},446 L${x + 16},446 Q${x + 46},446 ${x + 46},478 L${x + 46},560` }, "s3-fig");
        const legs = mk("path", { d: `M${x - 20},520 L${x - 20},664 M${x + 20},520 L${x + 20},664` }, "s3-fig");
        figs.push([head, torso, legs]);
        ties.push(mk("circle", { cx: x + 46, cy: 552, r: 9 }, "s3-tie"));
        ties.push(mk("circle", { cx: x - 20, cy: 652, r: 9 }, "s3-tie"));
        if (i < 8) chainD += (i === 0 ? `M${x + 46},552` : ` L${x + 46},552`) + ` L${x + DX - 20},652`;
      }
      chainD += ` L${X0 + 8 * DX + 46},552`;
      const chain = mk("path", { d: chainD, id: "s3-chain" });
      svg.insertBefore(chain, svg.firstChild);

      flash(30.6, 0.35);
      tl.fromTo("#s3-nine", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.01 }, 30.6);
      tl.fromTo("#s3-nine-cam", { scale: 0.9, filter: "blur(8px)" }, { scale: 1, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 30.6);
      tl.to("#s3-nine-cam", { scale: 1.05, duration: 3.0, ease: "power1.out" }, 31.3);
      figs.forEach((f, i) => { f.forEach((p, j) => draw(p, 30.6 + i * 0.085 + j * 0.06, 0.5, "power2.out")); });
      const cnt = { v: 0 }, cntEl = $("#s3-count-n");
      tl.fromTo(cnt, { v: 0 }, { v: 9, duration: 0.85, ease: "none", onUpdate: () => { const n = String(Math.max(1, Math.ceil(cnt.v))); if (cntEl.textContent !== n) cntEl.textContent = n; }, immediateRender: false }, 30.6);
      tl.fromTo("#s3-count", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 30.6);
      // "tied up" — a tie at every wrist and ankle; "wrist to ankle to each other" — one line binds the row
      ties.forEach((c, i) => draw(c, 31.28 + i * 0.03, 0.35, "power2.out"));
      draw(chain, 32.2, 1.35, "none");

      /* ---------- gate weave on photo planes (seeded sine, deterministic) ---------- */
      const weaves = $$("#s3-stage .s3-weave");
      const wv = { t: 0 };
      tl.fromTo(wv, { t: 0 }, { t: D, duration: D, ease: "none", immediateRender: false, onUpdate: () => {
        const f = Math.floor(wv.t * 24);
        const dx = Math.sin(f * 12.9898) * 0.9, dy = Math.sin(f * 78.233 + 1.3) * 0.7;
        weaves.forEach((w) => { w.style.translate = dx.toFixed(2) + "px " + dy.toFixed(2) + "px"; });
      } }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["s3"] = tl;
    })();
  </script>
