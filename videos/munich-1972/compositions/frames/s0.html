      const L1 = "05·09·1972 · 04:30 · CONNOLLYSTRASSE 31";
      const L2 = "06·09·1972 · MORNING";
      const SEQ = [{ t: 0, text: "" }];
      let tt = 0.06;
      for (let i = 1; i <= L1.length; i++) {
        const ch = L1[i - 1];

      }
      // "By the next morning" (20.48): backspace to the day digit, then retype
      let bt = 20.48;
      for (let i = L1.length - 1; i >= 1; i--) { bt += 0.012; SEQ.push({ t: bt, text: L1.slice(0, i) }); }

      for (let i = 2; i <= L2.length; i++) { bt += 0.045; SEQ.push({ t: bt, text: L2.slice(0, i) }); }

      const cursor = q("#s0-cursor");

      const bldgMove = q("#s0-bldg-move");

      // slam jolt on "it" (14.16)
      const JOLT_AT = 14.2;

        t: DUR, duration: DUR, ease: "none",

          const t = driver.t;

            slugText.textContent = s;
            lastText = s;

          // cursor blink (sin square wave); hidden on the black end card

          bldgMove.style.translate = (gx * 0.9).toFixed(2) + "px " + (gy * 1.1).toFixed(2) + "px";
          // shake / jolt
          let sx = 0, sy = 0;
          const ds = t - SHAKE_AT;
          if (ds > 0 && ds < SHAKE_DUR) {
            const k = 1 - ds / SHAKE_DUR;
            sx = Math.sin(ds * 92) * 9 * k * k;
            sy = Math.sin(ds * 71 + 1.3) * 6 * k * k;

          const dj = t - JOLT_AT;
          if (dj > 0 && dj < 0.3) { const k = 1 - dj / 0.3; sy += Math.sin(dj * 60) * 7 * k * k; }

      tl.set("#s0-slit", { scaleX: 1.6, opacity: 1 }, 10.08);

      tl.to("#s0-stage", { scale: 1.4, x: -100, duration: 1.3, ease: "power2.out" }, 10.1);
