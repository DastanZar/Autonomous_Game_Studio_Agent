  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      const DUR = 14.8;
      const tl = gsap.timeline({ paused: true });
      const $ = (id) => document.getElementById(id);

      // 34 hour ticks
      const ticksEl = $("s7-ticks");
      for (let i = 0; i < 34; i++) {
        const d = document.createElement("div");
        d.className = "s7-tick";
        d.style.left = (i * 22) + "px";
        if (i % 6 === 5) d.style.height = "56px"; else { d.style.height = "36px"; d.style.top = "20px"; }
        ticksEl.appendChild(d);
      }
      const ticks = ticksEl.querySelectorAll(".s7-tick");

      // ring / leader path lengths (measured)
      const ring = $("s7-ring"), leader = $("s7-leader");
      const RL = ring.getTotalLength(), LL = leader.getTotalLength();
      ring.style.strokeDasharray = RL; leader.style.strokeDasharray = LL;

      // ===== Beat 1 (0 – 3.8): the Games stop; 34 hours =====
      tl.fromTo("#s7-v1wrap", { scale: 1.0, x: 0 }, { scale: 1.08, x: -30, duration: 3.8, ease: "power1.in" }, 0);
      tl.fromTo("#s7-slug", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 0.2);
      tl.fromTo("#s7-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.2, ease: "power3.out" }, 0.2);
      tl.fromTo("#s7-stamp", { opacity: 0, scale: 1.25, filter: "blur(6px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.45, ease: "expo.out" }, 1.14);
      const hrs = { v: 0 };
      tl.to(hrs, { v: 34, duration: 1.2, ease: "power3.out", onUpdate: () => { $("s7-h-num").textContent = Math.round(hrs.v); } }, 2.42);
      tl.fromTo("#s7-h-num", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.2, ease: "power3.out" }, 2.42);
      tl.fromTo("#s7-h-unit", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.0);
      tl.fromTo(ticks, { scaleY: 0 }, { scaleY: 1, duration: 0.4, ease: "power3.out", stagger: 1.0 / 34 }, 2.42);

      // ===== Cut (3.8): zoom-through into the memorial photo, velocity matched =====
      tl.to("#s7-v1wrap", { scale: 1.32, opacity: 0, filter: "blur(8px)", duration: 0.32, ease: "power2.in" }, 3.62);
      tl.to(["#s7-stamp", "#s7-h-wrap", "#s7-ticks"], { opacity: 0, scale: 1.15, duration: 0.3, ease: "power2.in" }, 3.62);
      tl.fromTo("#s7-photo", { opacity: 0, scale: 0.9, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 3.8);
      // 2.5D: three planes, three speeds (push in the first half only)
      tl.fromTo("#s7-pl-bg", { scale: 1.08, x: 20, y: 0 }, { scale: 1.03, x: -10, y: -4, duration: 2.2, ease: "power2.out" }, 3.8);
      tl.fromTo(["#s7-pl-flag", "#s7-annot"], { scale: 1.12, x: 60, y: 6 }, { scale: 1.05, x: -30, y: -6, duration: 2.2, ease: "power2.out" }, 3.8);
      tl.fromTo("#s7-pl-crowd", { scale: 1.18, x: 90, y: 40 }, { scale: 1.06, x: -50, y: -8, duration: 2.2, ease: "power2.out" }, 3.8);
      // 80,000 people
      const ppl = { v: 0 };
      tl.to(ppl, { v: 80000, duration: 1.4, ease: "power3.out", onUpdate: () => { $("s7-p-num").textContent = Math.round(ppl.v / 10) * 10 >= 80000 ? "80,000" : (Math.round(ppl.v / 10) * 10).toLocaleString("en-US"); } }, 3.8);
      tl.fromTo("#s7-p-num", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.4, ease: "power3.out" }, 3.8);
      tl.fromTo("#s7-p-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 4.44);
      tl.fromTo("#s7-p-label", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.44);
      tl.fromTo("#s7-p-sub", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.32);
      // annotation on "memorial"
      tl.fromTo(ring, { strokeDashoffset: RL }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 6.28);
      tl.fromTo(leader, { strokeDashoffset: LL }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 6.7);
      tl.fromTo("#s7-annot-label", { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 6.9);

      // ===== Whip (7.7): photo whips left, the Israeli flag at half-mast arrives from the right =====
      tl.to("#s7-photo", { x: -420, filter: "blur(14px)", opacity: 0, duration: 0.3, ease: "power2.in" }, 7.5);
      tl.to(["#s7-p-wrap", "#s7-p-rule", "#s7-p-label", "#s7-p-sub"], { x: -420, opacity: 0, duration: 0.3, ease: "power2.in" }, 7.5);
      tl.fromTo("#s7-v2wrap", { opacity: 0, x: 420, filter: "blur(14px)" }, { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 7.7);
      tl.fromTo("#s7-v2wrap", { scale: 1.0 }, { scale: 1.06, duration: 2.7, ease: "none", immediateRender: false }, 7.7);
      tl.fromTo("#s7-ioc-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.8, ease: "power3.out" }, 8.68);
      tl.fromTo("#s7-ioc", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 9.02);

      // ===== Zoom-through (10.42): the stadium; Avery Brundage =====
      tl.to("#s7-v2wrap", { scale: 1.25, opacity: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, 10.24);
      tl.fromTo("#s7-v3wrap", { opacity: 0, scale: 0.94, filter: "blur(8px)" }, { opacity: 1, scale: 1.0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, 10.42);
      tl.to("#s7-v3wrap", { scale: 1.05, duration: 2.4, ease: "power1.out" }, 10.97);
      tl.fromTo("#s7-name", { clipPath: "inset(0 100% 0 0)", x: -20 }, { clipPath: "inset(0 0% 0 0)", x: 0, duration: 0.8, ease: "power3.out" }, 10.42);

      // ===== The quote (12.84 – end): everything recedes; word by word; then stillness =====
      tl.to("#s7-dim", { opacity: 0.72, duration: 0.8, ease: "power2.inOut" }, 12.5);
      tl.to("#s7-v3wrap", { filter: "blur(5px)", duration: 0.8, ease: "power2.inOut" }, 12.5);
      tl.to(["#s7-name", "#s7-ioc", "#s7-ioc-rule"], { opacity: 0, y: 30, duration: 0.5, ease: "power2.in" }, 12.4);
      const words = [["#s7-w0", 12.84], ["#s7-w1", 12.9], ["#s7-w2", 13.2], ["#s7-w3", 13.56], ["#s7-w4", 13.86]];
      words.forEach(([sel, at]) => tl.fromTo(sel, { opacity: 0, y: 26, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.55, ease: "power3.out" }, at));
      tl.fromTo("#s7-qrule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 14.0);
      tl.fromTo("#s7-attr", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power3.out" }, 14.1);

      // gate weave on archival footage: tiny seeded sine offsets, written per frame
      const weave = { t: 0 };
      const vids = [$("s7-v1"), $("s7-v2"), $("s7-v3")];
      const slugEl = $("s7-slug"); let lastSlug = null;
      tl.to(weave, { t: DUR, duration: DUR, ease: "none", onUpdate: () => {
        const f = Math.floor(weave.t * 24);
        const dx = Math.sin(f * 1.7) * 1.2 + Math.sin(f * 0.31) * 0.8;
        const dy = Math.sin(f * 2.3 + 1.1) * 1.0 + Math.sin(f * 0.23) * 0.9;
        const tf = "translate(" + dx.toFixed(2) + "px," + dy.toFixed(2) + "px)";
        for (let i = 0; i < vids.length; i++) vids[i].style.transform = tf;
        const sl = weave.t < 3.8 ? "06·09·1972  MUNICH" : "06·09·1972  OLYMPIASTADION";
        if (sl !== lastSlug) { slugEl.textContent = sl; lastSlug = sl; }
      } }, 0);

      window.__timelines = window.__timelines || {};
      window.__timelines["s7"] = tl;
    })();
  </script>
