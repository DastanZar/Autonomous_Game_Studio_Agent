  <script>
    (function () {
      const DUR = 20.0;
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector(s);
      const qa = (s) => Array.from(document.querySelectorAll(s));

      // ---------- slug: discrete states, each part typed on its spoken cue ----------
      const SEQ = [{ t: 0, text: "" }];
      function typeTo(full, fromLen, at, per) { let t = at; for (let i = fromLen + 1; i <= full.length; i++) { t += per; SEQ.push({ t, text: full.slice(0, i) }); } }
      const A = "05·09·1972", B = A + "  04:30", C = B + " · CONNOLLYSTRASSE 31";
      typeTo(A, 0, 0.2, 0.035);        // "Then,"
      typeTo(B, A.length, 1.68, 0.035); // "4:30"
      typeTo(C, B.length, 16.22, 0.02); // "31"
      const textAt = (time) => { for (let i = SEQ.length - 1; i >= 0; i--) if (time >= SEQ[i].t) return SEQ[i].text; return ""; };
      const slugText = q("#s2-slug-text"), cursor = q("#s2-cursor"), aerialMove = q("#s2-aerial-move");
      let last = null;
      const driver = { t: 0 };
      tl.to(driver, {
        t: DUR, duration: DUR, ease: "none",
        onUpdate: () => {
          const t = driver.t;
          const s = textAt(t);
          if (s !== last) { slugText.textContent = s; last = s; }
          cursor.style.opacity = Math.sin(t * Math.PI * 2 / 0.7) > 0 ? "1" : "0";
          const gx = Math.sin(t * 23.1) * 1.3 + Math.sin(t * 7.3 + 1.7) * 0.8;
          const gy = Math.sin(t * 19.7 + 0.6) * 1.0 + Math.sin(t * 5.9) * 0.6;
          aerialMove.style.translate = gx.toFixed(2) + "px " + gy.toFixed(2) + "px";
        }
      }, 0);
      tl.fromTo("#s2-rule", { scaleX: 0 }, { scaleX: 1, duration: 1.4, ease: "power3.out" }, 0.2);

      // ---------- A. "Then," (0.20): the colour drains out of the village ----------
      tl.fromTo("#s2-ground", { backgroundColor: "#F4F1EA" }, { backgroundColor: "#0F1114", duration: 1.6, ease: "power2.inOut" }, 0.1);
      tl.fromTo("#s2-aerial", { filter: "saturate(1) brightness(1)" }, { filter: "saturate(0.3) brightness(0.62)", duration: 2.6, ease: "power2.inOut" }, 0.2);
      tl.fromTo("#s2-aerial-move", { scale: 1.04, x: 40, y: 20 }, { scale: 1.16, x: -40, y: -10, duration: 5.45, ease: "none" }, 0);
